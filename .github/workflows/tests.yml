name: tests (CPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the suite when only files it doesn't cover changed. A skipped job still
  # reports a status; a workflow skipped by paths-ignore leaves checks pending.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No base to diff against (manual run, new branch): run everything.
          code=true
          if [ -n "$BASE" ] && git fetch -q --depth=1 origin "$BASE"; then
            files=$(git diff --name-only "$BASE" HEAD)
            grep -qvE '^((examples|notebooks|benchmarks)/|README\.md$)' <<< "$files" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Python ${{ matrix.python-version }}
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Two small wheels download faster than a cache restores.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Show environment
        run: |
          python --version
          uv --version

      - name: Install package
        run: uv pip install --system -e .

      - name: Show resolved dependencies
        run: uv pip list --system

      - name: Run test suite
        run: python -m unittest discover -s tests -v
